services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solarai
      POSTGRES_USER: solarai
      POSTGRES_PASSWORD: solarai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - solarai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarai -d solarai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0-rc1
      SECRET_KEY: local-docker-secret-key-change-before-production
      DATABASE_URL: postgresql+psycopg2://solarai:solarai_dev_password@db:5432/solarai
      CORS_ORIGINS: http://localhost:5173
      ALLOWED_HOSTS: localhost,127.0.0.1
      DEVICE_REQUEST_SIGNING_REQUIRED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  solarai_postgres:
